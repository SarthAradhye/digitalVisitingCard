<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aradhye Tech OPC Ltd.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1B2A4A;
      --gold: #C9A95A;
      --bg: #EEEDF3;
      --text-dark: #111;
      --text-mid: #444;
      --text-muted: #888;
      --wa-green: #25D366;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* ── Header ── */
    .page-header {
      text-align: center;
      flex-shrink: 0;
      padding: clamp(0.8rem, 2.5vh, 1.6rem) 1rem clamp(0.3rem, 0.8vh, 0.7rem);
      animation: fadeUp 0.6s ease both;
    }
    .eyebrow {
      font-size: clamp(9px, 2vw, 11px);
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 3px;
    }
    .page-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 7vw, 4rem);
      color: var(--navy);
      letter-spacing: 0.04em;
      line-height: 0.95;
    }
    .page-header h1 span { color: var(--gold); }

    /* ── Swiper ── */
    .swiper-wrap {
      width: 100%;
      max-width: 420px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 clamp(0.75rem, 4vw, 1.5rem);
      animation: fadeUp 0.6s ease 0.1s both;
    }

    .swiper-viewport {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border-radius: 20px;
      position: relative;
      box-shadow: 0 8px 50px rgba(27,42,74,0.18), 0 1px 4px rgba(27,42,74,0.08);
    }

    .swiper-track {
      display: flex;
      height: 100%;
      transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
      cursor: grab;
    }
    .swiper-track.dragging { cursor: grabbing; transition: none; }

    /* ── Slide base ── */
    .slide {
      flex: 0 0 100%;
      height: 100%;
      position: relative;
      background: var(--bg);
      overflow: hidden;
    }

    /* SVG fills the full slide */
    .slide-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Slide 1 text ── */
    .brand-text {
      position: absolute;
      bottom: 18%;
      right: 7%;
      text-align: right;
      z-index: 2;
      pointer-events: none;
    }
    .brand-text .company {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(50px, 13vw, 76px);
      color: var(--text-dark);
      letter-spacing: 0.02em;
      line-height: 0.88;
    }
    .brand-text .sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(14px, 3.5vw, 18px);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.22em;
      color: var(--text-mid);
      margin-top: 10px;
    }

    /* Swipe hint */
    .swipe-hint {
      position: absolute;
      right: 16px; bottom: 16px;
      display: flex; align-items: center; gap: 5px;
      font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--text-muted);
      z-index: 10; pointer-events: none;
      opacity: 0;
      animation: hintFade 3.2s ease 1.6s forwards;
    }
    @keyframes hintFade {
      0%   { opacity: 0; transform: translateX(8px); }
      20%  { opacity: 1; transform: translateX(0); }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ── Slide 2 text ── */
    .contact-inner {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: clamp(1.5rem, 4vh, 2.4rem) clamp(1.4rem, 5vw, 2.2rem);
      z-index: 2;
    }
    .contact-inner .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(46px, 12vw, 66px);
      color: var(--text-dark);
      line-height: 0.88;
      letter-spacing: 0.02em;
    }
    .contact-inner .role {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(14px, 3.5vw, 17px);
      font-weight: 300; font-style: italic;
      color: var(--gold); letter-spacing: 0.1em;
      margin-top: 10px;
    }
    .divider {
      width: 36px; height: 1.5px;
      background: var(--navy); opacity: 0.22;
      margin: clamp(0.8rem, 2vh, 1.3rem) 0;
      border-radius: 2px;
    }
    .contact-list { display: flex; flex-direction: column; gap: clamp(10px, 2vh, 15px); }
    .contact-item { display: flex; align-items: flex-start; gap: 11px; }
    .contact-item svg { flex-shrink: 0; margin-top: 2px; }
    .ci-label {
      font-size: 10px; font-weight: 400;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 2px;
    }
    .ci-value {
      font-size: clamp(12px, 3vw, 13px);
      color: var(--text-dark); line-height: 1.55;
    }
    .ci-value a { color: inherit; text-decoration: none; }
    .ci-value a:hover { text-decoration: underline; }

    /* WhatsApp pill */
    .wa-btn {
      display: inline-flex; align-items: center; gap: 7px;
      margin-top: 8px; padding: 6px 14px;
      background: var(--wa-green); color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 500;
      border-radius: 999px; text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
    }
    .wa-btn:hover { opacity: 0.88; transform: scale(1.03); }
    .wa-btn:active { transform: scale(0.97); }

    /* ── Dots ── */
    .dots {
      display: flex; justify-content: center; gap: 8px;
      padding: clamp(0.45rem, 1.1vh, 0.85rem) 0;
      flex-shrink: 0;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--navy); opacity: 0.2;
      transition: opacity 0.3s, transform 0.3s; cursor: pointer;
    }
    .dot.active { opacity: 1; transform: scale(1.4); }

    /* ── Footer ── */
    .page-footer {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(11px, 2vw, 13px);
      font-style: italic; color: var(--text-muted);
      letter-spacing: 0.06em;
      padding-bottom: clamp(0.5rem, 1.5vh, 1rem);
      flex-shrink: 0;
      animation: fadeUp 0.6s ease 0.25s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <p class="eyebrow">Digital Business Card</p>
    <h1>Aradhye <span>Tech</span></h1>
  </header>

  <div class="swiper-wrap">
    <div class="swiper-viewport">
      <div class="swiper-track" id="track">

        <!-- ══ SLIDE 1: Brand ══ -->
        <div class="slide">
          <!-- SVG geometric shapes using viewBox 0 0 100 100 = percentage coords -->
          <svg class="slide-svg" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Navy triangle: top-right corner -->
            <polygon points="30,0 100,0 100,45" fill="#1B2A4A"/>
            <!-- Gold triangle: top-left corner -->
            <polygon points="0,0 28,0 0,38" fill="#C9A95A"/>
            <!-- Navy wedge: bottom-left corner -->
            <polygon points="0,100 0,68 18,100" fill="#1B2A4A"/>
          </svg>

          <div class="brand-text">
            <div class="company">ARADHYE<br>TECH</div>
            <div class="sub">OPC ltd.</div>
          </div>

          <div class="swipe-hint">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
            swipe
          </div>
        </div>

        <!-- ══ SLIDE 2: Contact ══ -->
        <div class="slide">
          <svg class="slide-svg" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Navy triangle: bottom sweep left-to-right -->
            <polygon points="0,100 0,72 100,100" fill="#1B2A4A"/>
            <!-- Gold triangle: bottom-right corner -->
            <polygon points="55,100 100,100 100,78" fill="#C9A95A"/>
          </svg>

          <div class="contact-inner">
            <div class="name">SARTH<br>ARADHYE</div>
            <div class="role">Founder</div>
            <div class="divider"></div>
            <div class="contact-list">

              <!-- Email -->
              <div class="contact-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="1.8">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
                <div>
                  <div class="ci-label">Email</div>
                  <div class="ci-value">
                    <a href="mailto:sartharadhye@aradhyetech.com">sartharadhye@aradhyetech.com</a>
                  </div>
                </div>
              </div>

              <!-- Mobile + WhatsApp -->
              <div class="contact-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="1.8">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.6 3.48 2 2 0 0 1 3.57 1.3h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.84a16 16 0 0 0 6 6l.87-.87a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.46 16.18"/>
                </svg>
                <div>
                  <div class="ci-label">Mobile</div>
                  <div class="ci-value">
                    <a href="tel:+918652103136">+91 86521 03136</a>
                  </div>
                  <a class="wa-btn" href="https://wa.me/918652103136" target="_blank" rel="noopener">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="white">
                      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
                    </svg>
                    Chat on WhatsApp
                  </a>
                </div>
              </div>

              <!-- Address -->
              <div class="contact-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="1.8">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
                <div>
                  <div class="ci-label">Address</div>
                  <div class="ci-value">WeWork, 6th Floor, Hiranandani<br>Lightbridge, Powai, Andheri (East)</div>
                </div>
              </div>

            </div>
          </div>
        </div>

      </div><!-- /track -->
    </div><!-- /viewport -->

    <div class="dots">
      <div class="dot active" onclick="goTo(0)"></div>
      <div class="dot" onclick="goTo(1)"></div>
    </div>
  </div>

  <footer class="page-footer">Aradhye Tech OPC Ltd. &mdash; Mumbai</footer>

  <script>
    const track = document.getElementById('track');
    const dots  = document.querySelectorAll('.dot');
    let current = 0, startX = 0, diffX = 0, dragging = false;
    const THRESHOLD = 45;

    function goTo(idx) {
      current = Math.max(0, Math.min(1, idx));
      track.style.transform = `translateX(-${current * 100}%)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
    }

    /* Touch */
    track.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX; diffX = 0; dragging = true;
      track.style.transition = 'none';
    }, { passive: true });

    track.addEventListener('touchmove', e => {
      if (!dragging) return;
      diffX = e.touches[0].clientX - startX;
      track.style.transform = `translateX(calc(${-current * 100}% + ${diffX}px))`;
    }, { passive: true });

    track.addEventListener('touchend', () => {
      dragging = false;
      track.style.transition = '';
      if (diffX < -THRESHOLD) goTo(current + 1);
      else if (diffX > THRESHOLD) goTo(current - 1);
      else goTo(current);
    });

    /* Mouse drag */
    track.addEventListener('mousedown', e => {
      startX = e.clientX; diffX = 0; dragging = true;
      track.style.transition = 'none';
      track.classList.add('dragging');
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      diffX = e.clientX - startX;
      track.style.transform = `translateX(calc(${-current * 100}% + ${diffX}px))`;
    });
    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false; track.style.transition = '';
      track.classList.remove('dragging');
      if (diffX < -THRESHOLD) goTo(current + 1);
      else if (diffX > THRESHOLD) goTo(current - 1);
      else goTo(current);
    });

    /* Arrow keys */
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') goTo(current + 1);
      if (e.key === 'ArrowLeft')  goTo(current - 1);
    });
  </script>
</body>
</html>
